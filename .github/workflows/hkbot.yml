name: HK Stock Bot

on:
  schedule:
    # 香港時間 09:35 跑 (UTC 01:35) 逢星期一至五
    - cron: '35 1 * * 1-5'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install libs
        run: pip install -r requirements.txt
        
      - name: Run bot
        run: python hkbot.py
        env:
          TOKEN: ${{ secrets.TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
